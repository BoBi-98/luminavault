<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LuminaVault</title>

  <style>
    body {
      margin: 0;
      background: #0b0f19;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 700px;
    }

    h1 {
      font-size: 64px;
      margin-bottom: 10px;
    }

    p {
      color: #aab3c5;
      line-height: 1.7;
      font-size: 18px;
    }

    .tag {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 18px;
      border: 1px solid #2c3650;
      border-radius: 999px;
      color: #8ea2ff;
      font-size: 14px;
    }

    .footer {
      margin-top: 35px;
      color: #5d6885;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>LuminaVault</h1>

    <p>
      Decentralized media and AI asset storage infrastructure
      for next-generation Web3 applications.
    </p>

    <div class="tag">
      Powered by decentralized infrastructure research
    </div>

    <div class="footer">
      Exploring Shelby integration • AI media workflows • scalable delivery systems
    </div>
  </div>
</body>
</html>
